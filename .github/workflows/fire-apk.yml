name: Fire APK

# Every push to main builds cleanyourtv-fire.apk and publishes it on the rolling "latest" release:
#   https://github.com/<owner>/<repo>/releases/download/latest/cleanyourtv-fire.apk
# A v* tag also gets its own release.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "themes/**", "addons/**", "tests/**", "tools/**"]
  workflow_dispatch:

permissions:
  contents: write

# A newer push makes the running build pointless: cancel it (tags always finish).
concurrency:
  group: fire-apk-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # The runner image ships the Android SDK: install only what is missing (seconds when already there).
      - name: Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > launcher/local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
      # Caches ~/.gradle (wrapper, dependencies, build cache, configuration cache); written on main, read elsewhere.
      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          add-job-summary: on-failure
      # In ~/.gradle, not the project: no upstream file changes, so rebasing on upstream stays conflict-free.
      - name: Gradle tuning
        run: |
          mkdir -p ~/.gradle && cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.caching=true
          org.gradle.parallel=true
          org.gradle.configuration-cache=true
          org.gradle.configuration-cache.problems=warn
          org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
          EOF
      - name: Signing key
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fire.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/fire.jks" >> "$GITHUB_ENV"
      # No secrets: keep one debug key across runs, so builds still install over each other.
      - name: Debug key
        if: env.KEYSTORE_B64 == ''
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: fire-debug-keystore
      - name: No signing key
        if: env.KEYSTORE_B64 == ''
        run: echo "::notice::SIGNING_KEYSTORE_B64 not set; signed with the cached debug key"
      - name: Unit tests and release build
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/cleanyourtv-fire.apk"
      - name: Summary
        run: |
          APK="$RUNNER_TEMP/cleanyourtv-fire.apk"
          SIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          {
            echo "### cleanyourtv-fire.apk"
            echo "- size: $(( $(stat -c %s "$APK") / 1024 )) KB"
            echo "- commit: \`${GITHUB_SHA::7}\`"
            echo "- signer: \`$("$SIGNER" verify --print-certs "$APK" | sed -n 's/.*SHA-256 digest: //p' | head -1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: cleanyourtv-fire-${{ github.sha }}
          path: ${{ runner.temp }}/cleanyourtv-fire.apk
          compression-level: 0   # an APK is already a zip
          retention-days: 30
      # Rolling pre-release, always the last main build: a direct, login-free download of the bare APK.
      - name: Latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes 2>/dev/null || true
          gh release create latest "$RUNNER_TEMP/cleanyourtv-fire.apk" --prerelease --target "$GITHUB_SHA" \
            --title "Latest build (${GITHUB_SHA::7})" --notes "Automatic build of main at ${GITHUB_SHA::7}."
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ runner.temp }}/cleanyourtv-fire.apk
          generate_release_notes: true
