plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.gathin.tvhome'
    compileSdk = 34
    // AGP 9 makes unit tests for testBuildType only; release is the one CI builds, so it is the one tested.
    testBuildType = 'release'

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId = providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk = 26
        targetSdk = 34
        // CI: build number above upstream's 7, so every build installs over the previous one.
        versionCode = 100 + (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()
        versionName = '2.6'
    }

    // One fixed key for every build (CI secrets win when set), so each APK installs over the previous one.
    // fire-release.jks is committed on purpose: this is a sideloaded personal launcher, not a store app.
    def keystore = System.getenv('SIGNING_KEYSTORE') ?: file('fire-release.jks').path
    signingConfigs {
        fixed {
            storeFile = file(keystore)
            storePassword = System.getenv('SIGNING_PASSWORD') ?: 'cleanyourtv'
            keyAlias = System.getenv('SIGNING_ALIAS') ?: 'fire'
            keyPassword = System.getenv('SIGNING_PASSWORD') ?: 'cleanyourtv'
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.fixed
        }
    }

    packaging {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Installs the baseline profile (src/main/baseline-prof.txt) on devices without Play: faster cold start.
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
